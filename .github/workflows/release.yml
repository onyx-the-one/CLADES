name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libsdl2-dev libgl-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Rename binary
        run: cp build/clades clades-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clades-linux-x86_64
          path: clades-linux-x86_64

  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Rename binary
        run: cp build/clades clades-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clades-macos-arm64
          path: clades-macos-arm64

  release:
    name: Attach to GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/clades-linux-x86_64/clades-linux-x86_64
            artifacts/clades-macos-arm64/clades-macos-arm64
          body: |
            ## CLADES ${{ github.ref_name }}

            ### Download
            | Platform | Binary |
            |---|---|
            | Linux x86_64 | `clades-linux-x86_64` |
            | macOS arm64 | `clades-macos-arm64` |

            Linux/macOS: `chmod +x <binary> && ./<binary>`

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full usage instructions.
